[build]
  functions = "netlify/functions"
  publish   = "."

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from   = "/album"
  to     = "/album.html"
  status = 200

[[redirects]]
  from   = "/sucesso"
  to     = "/sucesso.html"
  status = 200

[context.production.environment]
  # SUPABASE_URL e SUPABASE_SERVICE_KEY devem ser configurados
  # manualmente em Site settings > Environment variables
